name: Release

# Publishes a release of the gateway and its adapters: six archives, the
# engine image for linux/amd64 and linux/arm64, their checksums and
# build-provenance attestations, from a tag a person pushes
# on a commit already on main (docs/releasing.md). Nothing here decides
# that there is to be a release, and nothing here writes its notes: both
# are a person's, reviewed in the pull request that added
# docs/releases/<tag>.md. What the workflow holds is that the tagged state
# passed everything CI asks of a commit, by the evidence a push to main
# recorded at that exact commit, that the archives are built from it and run
# where they say they run, and that no release is published until a
# maintainer has approved it at the `production` gate.
#
# What exists before that approval, and is not secret: the archives and the
# engine image's archive, as artifacts of the run that anyone who can read
# the repository's runs can download; their attestations, which are recorded
# in a public log when they are made; and the draft, which those who can
# write to the repository can see. Nothing is in the registry before it: the
# image is pushed by the publish job, past the gate, and a tag a registry
# serves can be moved, which a run artifact cannot. (The check of the image
# pushes it to a registry on the package job's own loopback, which nothing
# outside that runner reaches and which ends with the step.)
#
# Every job works on the commit the run was started for, by its digest. The
# tag is a name, and until a release is published nothing keeps a name from
# being moved: so the name is held to that commit when the run begins,
# before the draft is made, and before it is published.
#
# The engine image is built here from the tagged commit by the script CI
# runs on every push to main (build/engine-image.sh), into an OCI archive,
# and each platform's filesystem is held to the design by the same script,
# on this runner alone. The bytes of its index travel with the archives as a
# release asset, so that its SHA-256 -- the image digest -- is in
# checksums.txt, attested with them and stated in the release notes; the
# publish job holds the draft to the run's files, then pushes the archive
# under the release's version as its tag, every manifest by its digest, and
# reads the tag back, then holds the draft again and publishes the release
# (docs/design/engine-image.md, Provenance; docs/adr/0030).

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  RELEASE_TAG: ${{ github.ref_name }}
  # The repository's own package, in the lowercase a registry name takes.
  IMAGE: ghcr.io/judgment-pack/judgment-pack-gateway

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  admit:
    name: The tag names a release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reading an environment's protection rules.
      actions: read
    steps:
      # SemVer 2.0.0 for the three numbers and the prerelease, which has no
      # empty identifier and no numeric one with a leading zero. Build
      # metadata (+...) is refused: two tags that differ only in it would
      # be one version under two names.
      - name: The tag is an exact version
        shell: bash
        run: |
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          version="^v${number}\.${number}\.${number}(-${identifier}(\.${identifier})*)?$"
          if [[ ! "${RELEASE_TAG}" =~ ${version} ]]; then
            echo "the tag is not a version this workflow releases (vX.Y.Z or vX.Y.Z-prerelease, no build metadata): ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Check out the commit the run was started for
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: The tag names the commit the run was started for
        shell: bash
        run: |
          # The patterns of ls-remote match the end of a name, so another ref
          # whose name ends in this one is answered too: the lines are taken
          # by their exact names. The peeled line is the commit an annotated
          # tag points to; a plain tag has its own line alone.
          named="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            | awk -v tag="refs/tags/${RELEASE_TAG}" '$2 == tag { plain = $1 } $2 == tag "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : plain) }')"
          [ -n "${named}" ] && [ "${named}" = "${GITHUB_SHA}" ] || { echo "refs/tags/${RELEASE_TAG} names ${named:-nothing}, and the run was started for ${GITHUB_SHA}" >&2; exit 1; }

      # A tag names a reviewed state (CONTRIBUTING.md, Tags), and what is
      # reviewed is what merged: a tag on a branch's commit names a state
      # main may never hold. Any commit main holds is admitted, not its
      # newest alone, and the checks it is held to are CI's as that commit
      # has them. Main is named in full: the short name would be answered
      # by a tag called origin/main before the branch.
      - name: The tagged commit is on main
        shell: bash
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main || { echo "the tagged commit ${GITHUB_SHA} is not on main" >&2; exit 1; }

      - name: The release has notes a person wrote
        shell: bash
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          test -s "${notes}" || { echo "${notes} is missing or empty at the tag" >&2; exit 1; }

      # The publish job waits at the `production` environment, and an
      # environment a workflow names without its existing is made on the
      # spot with no rule at all: the gate would be a name. So the rule is
      # read here, before anything is built, and its absence is a refusal.
      - name: The production gate requires a reviewer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          reviewers="$(gh api "repos/${GH_REPO}/environments/production" --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')" \
            || { echo "the production environment could not be read; create it, with a required reviewer (docs/releasing.md)" >&2; exit 1; }
          [ "${reviewers}" -ge 1 ] || { echo "the production environment requires no reviewer" >&2; exit 1; }

  # Everything CI asks of a commit, as CI stands at that commit, taken from the
  # evidence a push to main recorded at the tagged commit itself: every job
  # and leg of the commit's own ci.yml, Linux, macOS and Windows, with the
  # commit's inputs and each leg's toolchain (scripts/dev/release_evidence.py
  # verify, vendored from the development kit, configured by
  # .github/ci-evidence.json; docs/releasing.md). ci.yml is not run again.
  # Evidence that is missing, partial, older than 48 hours, of a newer failed,
  # cancelled or running attempt, of other inputs or another toolchain, or
  # unreadable refuses, by name, and the release stops: nothing here re-runs
  # or dispatches anything, and the fresh route is the maintainer's
  # (docs/releasing.md, "If a run fails"). The decision, reuse or refusal, is
  # in the log and kept as the run's release-evidence-<attempt> artifact.
  verify:
    name: CI at the tag
    needs: admit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Reading the runs, jobs and artifacts of ci.yml.
      actions: read
    steps:
      - name: Check out the commit the run was started for
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # The check job's toolchains and the Linux leg's Go, set up here as ci.yml
      # sets them up, by the same actions: the gate holds their evidence to what
      # this runner resolves (compare release-runner), so a newer runner image
      # or toolchain since main's run refuses.
      - name: Read the toolchains from dev.json and release.yml
        id: dev
        run: |
          set -eu
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("dev.json", encoding="utf-8"))
          tc = m.get("toolchains", {})
          print("node=" + tc.get("node", {}).get("version", ""))
          print("python=" + tc.get("python", {}).get("version", "3.12"))
          PY
          # The toolchain the release workflow names, exactly: the third-party notices carry the
          # toolchain's own licence, so they are held with the toolchain that links a release
          # (scripts/checks/release-toolchain.sh checks that this is it).
          named="$(sed -n "s/^ *go-version: *['\"]\{0,1\}\([0-9][0-9.]*\)['\"]\{0,1\} *\$/\1/p" .github/workflows/release.yml)"
          [ -n "${named}" ] || { echo 'release.yml names no Go version' >&2; exit 1; }
          echo "go=${named}" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ steps.dev.outputs.go }}
          # Resolving the toolchain is all this job asks of it: no module cache.
          cache: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.dev.outputs.node }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.dev.outputs.python }}

      - name: Reuse main's exact-commit CI evidence, or refuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dev/release_evidence.py verify --output "${RUNNER_TEMP}/release-evidence.json"

      # The decision record, reuse or refusal; it is also in the log of the
      # step above.
      - name: Keep the decision record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence.json
          if-no-files-found: error

  package:
    name: Package
    needs:
      - admit
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the commit the run was started for
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Release binaries use one reviewed toolchain, named exactly. The
          # go directive in each go.mod remains the floor CI tests.
          go-version: 1.26.5
          cache-dependency-path: adapters/go.sum

      # Held by CI already, and again here, on the commit being packaged and
      # with the toolchain that links it, whose own licence is part of them.
      - name: The notices are what this toolchain and the linked modules say
        run: python3 build/third_party_notices.py --check

      - name: Normalize archive file timestamps
        shell: bash
        run: |
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          git ls-files -z -- LICENSE README.md SECURITY.md SPEC.md THIRD_PARTY_NOTICES catalog corpus \
            | xargs -0 touch --date="@${source_date_epoch}"

      - name: Package without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --skip=publish
        env:
          # Stated, not inferred: a commit may carry a tag of another family
          # beside this one (n8n-nodes-judgment-pack@...).
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}

      # Held of the archives themselves, all six, and not of the
      # configuration that was meant to make them: an archive holds files
      # and nothing else, each in the form the packer writes, under its
      # plain name and once; the files are the commit's, byte for byte;
      # each program is one program built from the package of its name,
      # for the archive's platform, at the level a release promises, and
      # is the bytes the packer built; the archive reads to its end
      # (build/release_archives.py, which CI runs against sound archives
      # and against archives spoiled one way at a time).
      - name: Each archive holds the corpus, the catalog and the programs, and nothing else
        shell: bash
        run: python3 build/release_archives.py --dist dist --version "${RELEASE_TAG#v}" --commit "${GITHUB_SHA}"

      # The engine image from the same commit, for linux/amd64 and
      # linux/arm64, by the script CI runs (scripts/checks/image-platforms.sh):
      # an OCI archive the publish job pushes past the gate, and the bytes of
      # its index, which join the archives as a release asset, so that the
      # image digest -- their SHA-256 -- is a line of checksums.txt and
      # attested with them. The gateway inside reports the release's tag, as
      # the archives' does.
      - name: Build the engine image
        shell: bash
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          build/engine-image.sh build "${RUNNER_TEMP}/engine-image"
          index="judgment-pack-gateway_${RELEASE_TAG#v}_engine-image.index.json"
          cp "${RUNNER_TEMP}/engine-image/engine-image.index.json" "dist/${index}"
          digest="$(cat "${RUNNER_TEMP}/engine-image/engine-image.digest")"
          printf '%s  %s\n' "${digest#sha256:}" "${index}" >> dist/checksums.txt

      # Each platform's image held to what the design states, by the check CI
      # runs on the image it builds for its own host (.github/image_checks.py):
      # no set-user-id file, no capability but the gateway's, owners and
      # modes, a static launcher, the notices, the runtime the pin names. The
      # archive is pushed to a registry on this runner's loopback that lives
      # as long as the step, never the release's registry; each platform's
      # image is pulled from it by its digest, created as a container, which
      # runs nothing, and exported (build/engine-image.sh check).
      - name: Each platform's image holds what the design states
        shell: bash
        run: build/engine-image.sh check "${RUNNER_TEMP}/engine-image"

      # Printed, so that the run's own record says what it packaged. The
      # publish job holds the draft to these again before it publishes.
      - name: Verify packaged checksums
        working-directory: dist
        run: |
          sha256sum --check checksums.txt
          cat checksums.txt

      # The notes a person wrote, and after them what this run alone knows:
      # the image by its tag and by its digest.
      - name: Carry the release notes with the archives
        shell: bash
        run: |
          cp "docs/releases/${RELEASE_TAG}.md" dist/release-notes.md
          version="${RELEASE_TAG#v}"
          digest="$(cat "${RUNNER_TEMP}/engine-image/engine-image.digest")"
          {
            printf '\n## Engine image\n\n'
            printf '`%s:%s`, for linux/amd64 and linux/arm64, is the image index `%s`: pin it as `%s@%s`. ' "${IMAGE}" "${version}" "${digest}" "${IMAGE}" "${digest}"
            printf 'The index itself is `judgment-pack-gateway_%s_engine-image.index.json` among this release'"'"'s files, named in `checksums.txt` by that digest and attested with the archives.\n' "${version}"
          } >> dist/release-notes.md

      - name: Upload release archives for native smoke tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/release-notes.md
            dist/*_engine-image.index.json
          if-no-files-found: error
          # As long as an approval may be waited for: the publish job reads
          # it again on the far side of the gate.
          retention-days: 30

      # The image itself, for the publish job alone: no smoke test reads it,
      # and nothing pushes it to the registry before the gate.
      - name: Upload the engine image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image
          path: |
            ${{ runner.temp }}/engine-image/engine-image.tar
            ${{ runner.temp }}/engine-image/engine-image.index.json
            ${{ runner.temp }}/engine-image/engine-image.digest
          if-no-files-found: error
          retention-days: 30

  smoke-unix:
    name: ${{ matrix.os }} release archive
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # linux/arm64 runs natively somewhere before the gate: a macOS arm
          # runner executes the darwin binary, not this one.
          - ubuntu-24.04-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download packaged archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      # The adapters' tests run on Linux (ci.yml), and the package job has
      # held every program of the archive to the commit. What is held of
      # the adapters here, where the archive runs, is that three of them
      # start and print their usage line.
      - name: Verify and smoke-test native archive
        shell: bash
        run: |
          case "$(uname -s)" in
            Darwin) release_os="darwin"; checksum_command=(shasum -a 256 --check) ;;
            Linux) release_os="linux"; checksum_command=(sha256sum --check) ;;
            *) echo "unsupported runner OS: $(uname -s)" >&2; exit 1 ;;
          esac

          case "$(uname -m)" in
            arm64|aarch64) release_arch="arm64" ;;
            x86_64) release_arch="amd64" ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          release_version="${RELEASE_TAG#v}"
          archive="judgment-pack-gateway_${release_version}_${release_os}_${release_arch}.tar.gz"
          destination="${RUNNER_TEMP}/gateway-release-smoke"

          (cd dist && "${checksum_command[@]}" checksums.txt)
          mkdir -p "${destination}"
          tar -xzf "dist/${archive}" -C "${destination}"

          # Taken first and compared after, so that a program that prints the
          # right words and fails is a failure.
          reported="$("${destination}/gateway" version)"
          [ "${reported}" = "gateway ${RELEASE_TAG}" ] || { echo "gateway reports ${reported}" >&2; exit 1; }
          "${destination}/gateway" conform --corpus "${destination}/corpus"

          for program in adapter-airbyte adapter-http adapter-mcp; do
            # A usage line is an exit of 2, which is the answer wanted.
            output="$("${destination}/${program}" 2>&1 < /dev/null)" && code=0 || code=$?
            if [ "${code}" != "2" ] || [[ "${output}" != "usage: ${program} "* ]]; then
              echo "${program} did not start as built: exit ${code}: ${output}" >&2
              exit 1
            fi
          done

  smoke-windows:
    name: windows-latest release archive
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download packaged archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Verify and smoke-test native archive
        shell: pwsh
        run: |
          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          $archive = "judgment-pack-gateway_${releaseVersion}_windows_amd64.zip"
          $archivePath = Join-Path "dist" $archive
          $checksumLine = Get-Content "dist/checksums.txt" |
            Where-Object { $_ -match "[ *]$([regex]::Escape($archive))$" }

          if (-not $checksumLine) {
            throw "No checksum found for $archive"
          }

          $expected = ($checksumLine -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Checksum mismatch for $archive"
          }

          $destination = Join-Path $env:RUNNER_TEMP "gateway-release-smoke"
          Expand-Archive -Path $archivePath -DestinationPath $destination

          $gateway = Join-Path $destination "gateway.exe"
          $reportedVersion = & $gateway version
          if ($LASTEXITCODE -ne 0 -or $reportedVersion -ne "gateway $($env:RELEASE_TAG)") {
            throw "Unexpected version output: $reportedVersion"
          }

          & $gateway conform --corpus (Join-Path $destination "corpus")
          if ($LASTEXITCODE -ne 0) {
            throw "The released gateway disagrees with the corpus it carries"
          }

  attest-and-draft:
    name: Attest and draft release
    needs:
      - package
      - smoke-unix
      - smoke-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # The draft this run made, by its id: the publish job reads and
      # publishes that release, never a name.
      release-id: ${{ steps.draft.outputs.release-id }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download smoke-tested archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: The tag still names the commit the run was started for
        shell: bash
        run: |
          named="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            | awk -v tag="refs/tags/${RELEASE_TAG}" '$2 == tag { plain = $1 } $2 == tag "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : plain) }')"
          [ -n "${named}" ] && [ "${named}" = "${GITHUB_SHA}" ] || { echo "refs/tags/${RELEASE_TAG} names ${named:-nothing}, and the archives were built from ${GITHUB_SHA}" >&2; exit 1; }

      # A release under this tag, draft or published, is never replaced or
      # completed from here: what a failed run left is looked at by a
      # person (docs/releasing.md, "If a run fails").
      - name: No release exists under this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Every release is listed, drafts among them, and looked for by its
          # tag: a lookup that fails is a failure of the step, never an absence.
          state="$(gh api "repos/${GH_REPO}/releases" --paginate --jq '.[] | select(.tag_name == env.RELEASE_TAG) | if .draft then "a draft" else "published" end')"
          if [ -n "${state}" ]; then
            echo "a release under ${RELEASE_TAG} already exists, and it is $(echo "${state}" | sort -u | paste -sd, -)" >&2
            exit 1
          fi

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # The index's line above already names the image digest, under the
      # asset's name; this names it as the image, so that a reader holding
      # only the registry's reference finds the attestation by it
      # (gh attestation verify oci://...). Nothing is pushed to the registry.
      - name: Read the engine image's digest
        id: image
        shell: bash
        run: |
          shopt -s nullglob
          index=(dist/*_engine-image.index.json)
          (( ${#index[@]} == 1 )) || { echo "expected one engine image index, found ${#index[@]}" >&2; exit 1; }
          echo "digest=sha256:$(sha256sum "${index[0]}" | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"

      - name: Attest the engine image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}

      - name: Create draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout (it only consumes the packaged
          # artifact), so `gh` cannot infer the repository from a remote.
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip dist/*_engine-image.index.json dist/checksums.txt)
          if (( ${#assets[@]} != 8 )); then
            echo "expected six archives, the engine image's index and checksums.txt, found ${#assets[@]} files" >&2
            exit 1
          fi

          release_args=(
            "${RELEASE_TAG}"
            "${assets[@]}"
            --draft
            --notes-file dist/release-notes.md
            --title "gateway ${RELEASE_TAG}"
            --verify-tag
          )
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"

          # The one draft under the tag, which this job has just made (no
          # release existed under it before). The listing can lag the
          # creation by a few seconds: read it again until the draft
          # appears, at most twelve times.
          release_id=""
          for attempt in $(seq 1 12); do
            release_id="$(gh api "repos/${GH_REPO}/releases" --paginate --jq '.[] | select(.tag_name == env.RELEASE_TAG and .draft) | .id')"
            [[ "${release_id}" =~ ^[0-9]+$ ]] && break
            sleep 5
          done
          [[ "${release_id}" =~ ^[0-9]+$ ]] || { echo "Expected one draft release under ${RELEASE_TAG}; found: ${release_id:-none}" >&2; exit 1; }
          echo "release-id=${release_id}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish release
    needs: attest-and-draft
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: write
      # Pushing the engine image to the repository's own package, past the gate.
      packages: write
    env:
      RELEASE_ID: ${{ needs.attest-and-draft.outputs.release-id }}
    steps:
      - name: The tag still names the commit the run was started for
        shell: bash
        run: |
          named="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            | awk -v tag="refs/tags/${RELEASE_TAG}" '$2 == tag { plain = $1 } $2 == tag "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : plain) }')"
          [ -n "${named}" ] && [ "${named}" = "${GITHUB_SHA}" ] || { echo "refs/tags/${RELEASE_TAG} names ${named:-nothing}, and the draft was built from ${GITHUB_SHA}" >&2; exit 1; }

      - name: Download the archives this run packaged
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: run

      - name: Download the engine image this run built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-image
          path: image

      # For build/engine-image.sh alone, as the tagged commit has it.
      - name: Check out the commit the run was started for
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: source

      # The run's own files, the bytes the draft must hold: checksums.txt in
      # the one form this workflow writes it, naming the six archives and the
      # engine image's index, each once, and every file the bytes that list
      # names.
      - name: Hold the run's files to their checksums
        shell: bash
        working-directory: run
        run: |
          if grep -q -v -E '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' checksums.txt; then
            echo "checksums.txt holds a line that is not a digest, two spaces and a plain name" >&2
            exit 1
          fi
          named="$(awk '{ print "./" $2 }' checksums.txt | LC_ALL=C sort)"
          archives="$(find . -type f ! -name checksums.txt ! -name release-notes.md | LC_ALL=C sort)"
          [ "${named}" = "${archives}" ] || { echo "checksums.txt does not name the run's archives, each once:" >&2; diff <(echo "${named}") <(echo "${archives}") >&2; exit 1; }
          sha256sum --check --strict checksums.txt

      # The draft has waited at the gate, and whoever may write to the
      # repository could have changed it there. The release this run
      # drafted is read through the API by its id, never downloaded: its
      # state, title and notes, then the digest GitHub reports for each
      # asset, compared with the run's files, no asset more or fewer. Any
      # difference refuses here, before anything is pushed.
      - name: The draft holds what this run packaged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # gh runs outside the job's one checkout (source/); tell it which
          # repository to target.
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "${RELEASE_ID}" =~ ^[0-9]+$ ]] || { echo "no release id from the draft job: ${RELEASE_ID:-none}" >&2; exit 1; }
          packaged="$(cd run && for name in $(find . -type f ! -name release-notes.md -printf '%P\n'); do printf '%s sha256:%s\n' "${name}" "$(sha256sum "${name}" | cut -d ' ' -f 1)"; done | LC_ALL=C sort)"

          state="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}" --jq '[.draft, .tag_name, .name] | @tsv')"
          [ "${state}" = "$(printf 'true\t%s\tgateway %s' "${RELEASE_TAG}" "${RELEASE_TAG}")" ] || { echo "release ${RELEASE_ID} is not this run's draft of ${RELEASE_TAG}: ${state}" >&2; exit 1; }
          # Both are taken without the newlines they end in, which the two
          # ways of reading them do not agree on.
          drafted_notes="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}" --jq .body)"
          packaged_notes="$(cat run/release-notes.md)"
          [ "${drafted_notes}" = "${packaged_notes}" ] || { echo "the draft's notes are not the notes the commit holds:" >&2; diff <(echo "${packaged_notes}") <(echo "${drafted_notes}") >&2; exit 1; }

          drafted="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" --paginate --jq '.[] | "\(.name) \(.digest)"' | LC_ALL=C sort)"
          if [ "${drafted}" != "${packaged}" ]; then
            printf 'the draft does not hold what this run packaged.\nThis run packaged:\n%s\nThe draft holds:\n%s\n' "${packaged}" "${drafted}" >&2
            exit 1
          fi

      # Past the gate, once the draft is held to the run, and before it is
      # published: the image the run's files name -- its index byte for byte
      # the asset's -- pushed under the version, every manifest by its
      # digest, and the tag read back from the registry and held to that
      # digest. A draft check that refuses leaves nothing in the registry; a
      # push that fails leaves the draft unpublished. Nothing in the steps
      # before this one reads the registry. The credential is the job's
      # token, in a file of this runner's alone that the copier reads, never
      # an argument, and is removed after.
      - name: Push the engine image by its digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          index="run/judgment-pack-gateway_${RELEASE_TAG#v}_engine-image.index.json"
          cmp -s "${index}" image/engine-image.index.json || { echo "the image this run built is not the one its files name" >&2; exit 1; }
          auth="${RUNNER_TEMP}/registry-auth.json"
          trap 'rm -f "${auth}"' EXIT
          (umask 077 && printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$(printf '%s:%s' "${GITHUB_ACTOR}" "${GH_TOKEN}" | base64 -w 0)" > "${auth}")
          REGISTRY_AUTH_FILE="${auth}" source/build/engine-image.sh push image "${IMAGE}:${RELEASE_TAG#v}"

      # The same reads again, now that the push is done, and the publish
      # call at once after the last of them, by the same id, never by the
      # tag: the moment between the two is the residual window
      # docs/releasing.md states, and the next step closes it after the
      # fact.
      - name: The draft still holds what this run packaged, and is published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # gh runs outside the job's one checkout (source/); tell it which
          # repository to target.
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "${RELEASE_ID}" =~ ^[0-9]+$ ]] || { echo "no release id from the draft job: ${RELEASE_ID:-none}" >&2; exit 1; }
          packaged="$(cd run && for name in $(find . -type f ! -name release-notes.md -printf '%P\n'); do printf '%s sha256:%s\n' "${name}" "$(sha256sum "${name}" | cut -d ' ' -f 1)"; done | LC_ALL=C sort)"

          state="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}" --jq '[.draft, .tag_name, .name] | @tsv')"
          [ "${state}" = "$(printf 'true\t%s\tgateway %s' "${RELEASE_TAG}" "${RELEASE_TAG}")" ] || { echo "release ${RELEASE_ID} is not this run's draft of ${RELEASE_TAG}: ${state}" >&2; exit 1; }
          # Both are taken without the newlines they end in, which the two
          # ways of reading them do not agree on.
          drafted_notes="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}" --jq .body)"
          packaged_notes="$(cat run/release-notes.md)"
          [ "${drafted_notes}" = "${packaged_notes}" ] || { echo "the draft's notes are not the notes the commit holds:" >&2; diff <(echo "${packaged_notes}") <(echo "${drafted_notes}") >&2; exit 1; }

          drafted="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" --paginate --jq '.[] | "\(.name) \(.digest)"' | LC_ALL=C sort)"
          if [ "${drafted}" != "${packaged}" ]; then
            printf 'the draft does not hold what this run packaged.\nThis run packaged:\n%s\nThe draft holds:\n%s\n' "${packaged}" "${drafted}" >&2
            exit 1
          fi

          # A prerelease (the tag contains a hyphen) is never marked latest.
          latest=true
          [[ "${RELEASE_TAG}" != *-* ]] || latest=false
          gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" -F draft=false -f make_latest="${latest}" --silent

      # Published, the release is immutable once the repository's release
      # immutability is on (docs/releasing.md). Its assets are read once more:
      # a file replaced in the window is published only as a release this job
      # fails, by name, with both digest sets.
      - name: The published release holds what this run packaged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          packaged="$(cd run && for name in $(find . -type f ! -name release-notes.md -printf '%P\n'); do printf '%s sha256:%s\n' "${name}" "$(sha256sum "${name}" | cut -d ' ' -f 1)"; done | LC_ALL=C sort)"
          # A read that cannot be completed is not a finding about the
          # release: it fails by its own name, makes no diagnosis, and
          # leaves the maintainer to read the release again
          # (docs/releasing.md).
          unverified() {
            echo "the published release could not be verified: ${1}" >&2
            echo "release ${RELEASE_ID} of ${RELEASE_TAG} is unverified, not found changed; read it again (docs/releasing.md)" >&2
            exit 1
          }
          draft="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}" --jq .draft 2>&1)" || unverified "${draft}"
          published="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" --paginate --jq '.[] | "\(.name) \(.digest)"' 2>&1)" || unverified "${published}"
          [[ "${draft}" == true || "${draft}" == false ]] || unverified "the release read returned ${draft:-nothing}"
          [ -n "${published}" ] || unverified "the asset list came back empty"
          published="$(printf '%s\n' "${published}" | LC_ALL=C sort)"
          if [ "${draft}" != "false" ] || [ "${published}" != "${packaged}" ]; then
            printf 'the published release does not hold what this run packaged (release %s of %s, draft: %s).\nThis run packaged:\n%s\nThe release holds:\n%s\n' \
              "${RELEASE_ID}" "${RELEASE_TAG}" "${draft}" "${packaged}" "${published}" >&2
            exit 1
          fi
          echo "published ${RELEASE_TAG} (release ${RELEASE_ID}):"
          echo "${published}"
