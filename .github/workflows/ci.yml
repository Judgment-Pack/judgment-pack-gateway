name: CI

# The check list is dev.json, run by scripts/dev/check.sh (the development kit's vendored runner).
# Three jobs. `go` is the operating system matrix: its job names are required by branch protection,
# and its legs run the core's Go steps natively on each platform. `check` sets the toolchains up
# from the manifest and runs every step of it: the core, the adapters, the release contents, the
# plugins, the second implementation, the engine image, the witness scenario and the agreement of
# the two paths. On a pull request it runs the steps jpdev.json maps the changed paths to
# (`check.sh --changed`); on a push to main, the whole list. Each of the steps that were jobs of
# their own is a step of dev.json, and the longer ones are scripts under scripts/checks/ with the
# comments they had here. `postgresql` runs the PostgreSQL storage kind's tests against a server in
# a service container pinned by digest (docs/postgresql-store.md); without a server they skip, so
# here a skip fails the job.
#
# A push to main also records, in every job and every leg, the evidence a release takes instead
# of running this workflow again (scripts/dev/release_evidence.py capture, configured by
# .github/ci-evidence.json; docs/releasing.md): the commit, its input identities, the runner and
# toolchain, and for `check` every step's result. A pull request records none.

on:
  pull_request:
  push:
    branches: [main]
  # Kept, but nothing calls it: the release takes the evidence a push to main
  # recorded at the tagged commit, or refuses (release.yml, docs/releasing.md).
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: ${{ matrix.os }} · Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.26"
          - os: macos-latest
            go: "1.26"
          - os: windows-latest
            go: "1.26"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # matrix.go is the line the job's name carries, and the names are what
      # branch protection requires. The toolchain is the one release.yml names,
      # exactly: the release takes each leg's evidence only at that version
      # (.github/ci-evidence.json; .github/test_ci_evidence.py holds the two equal).
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.5"
      - name: Formatting is canonical
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Native sandbox boundary tests
        shell: bash
        working-directory: adapters
        env:
          GOWORK: off
        run: |
          go test -count=1 -timeout 90s ./internal/sandbox
          go test -count=1 -timeout 120s -run '^(TestWindowsCustomerSandboxUnavailable|TestCustomerExecutable.*|TestCustomerLoaderVariableRefused)$' ./mcp
      - name: Build
        run: go build -buildvcs=false -o gateway .
      # The corpus is the arbiter: frozen data, not output regenerated from
      # the code it checks. The second implementation answers to it in its
      # own job, below.
      - name: The implementation agrees with the frozen corpus
        run: ./gateway conform
      # The stand-in engine the plugin smoke checkers are tested against
      # (plugins/smoke/testing) is held to this engine, request for request:
      # a stand-in that drifts from the engine fails here, not in a smoke run
      # before publishing. Standard library Python; the source it starts the
      # engine with is a shell script, so Linux only.
      - name: The smoke stand-in answers as this engine does
        if: matrix.os == 'ubuntu-latest'
        env:
          GATEWAY_BIN: ${{ github.workspace }}/go/gateway
          SMOKE_REQUIRE_ENGINE: "1"
        run: python3 -m unittest discover -s ../plugins/smoke/testing -p test_stand_in_engine.py -v
      - name: No third-party modules
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -f go.sum ]; then echo "go.sum exists: a dependency crept in"; exit 1; fi
          go list -deps . | grep -v '^gateway$' | grep -vE '^(internal/|[a-z]+(/|$))' && exit 1 || true
      # The process boundary is the security claim (docs/adr/0001): the module
      # that holds the seed is never linked to the module that holds platform
      # credentials. The filter above judges import spelling, and spelling is
      # not provenance: a workspace file or a replace directive can make any
      # name resolve anywhere. So this step asks the toolchain where every
      # dependency actually resolved (`.Standard`), with workspaces disabled,
      # and refuses the files and directives that would redirect resolution.
      - name: Every core dependency resolves into the standard library
        if: matrix.os == 'ubuntu-latest'
        env:
          GOWORK: off
        run: |
          find .. -name go.work -not -path '*/.git/*' | grep -q . && { echo "a go.work file is present"; exit 1; } || true
          grep -nE '^\s*(require|replace|exclude)\b' go.mod && { echo "go.mod declares a dependency, replacement, or exclusion"; exit 1; } || true
          go list -deps -f '{{.ImportPath}} {{.Standard}} {{.Dir}}' . \
            | awk '$1 != "gateway" && $2 != "true" { print "resolves outside the standard library: " $0; bad = 1 } END { exit bad }'
          go list -deps . | grep -qx plugin && { echo "the core imports plugin"; exit 1; } || true
      # The leg's evidence, on a push to main only: its platform and toolchain,
      # beside the job's result the API reports. From the checkout's root, with
      # the interpreter each image carries.
      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        working-directory: .
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          JOB_KEY: go-${{ matrix.os }}
        run: |
          "${PYTHON}" scripts/dev/release_evidence.py capture --workflow ci --job "${JOB_KEY}" --output "${RUNNER_TEMP}/evidence.json"
      - name: Upload immutable CI evidence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-ci-go-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The whole history, so that --changed finds the merge base with the base branch.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # First, so that a manifest that does not parse fails before the long steps start.
      - name: Read the toolchains from dev.json and release.yml
        id: dev
        run: |
          set -eu
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("dev.json", encoding="utf-8"))
          tc = m.get("toolchains", {})
          print("node=" + tc.get("node", {}).get("version", ""))
          print("python=" + tc.get("python", {}).get("version", "3.12"))
          PY
          # The toolchain the release workflow names, exactly: the third-party notices carry the
          # toolchain's own licence, so they are held with the toolchain that links a release
          # (scripts/checks/release-toolchain.sh checks that this is it).
          named="$(sed -n "s/^ *go-version: *['\"]\{0,1\}\([0-9][0-9.]*\)['\"]\{0,1\} *\$/\1/p" .github/workflows/release.yml)"
          [ -n "${named}" ] || { echo 'release.yml names no Go version' >&2; exit 1; }
          echo "go=${named}" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ steps.dev.outputs.go }}
          cache-dependency-path: adapters/go.sum
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.dev.outputs.node }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.dev.outputs.python }}
      # Each summary is kept for the evidence below.
      - name: Setup steps
        run: |
          set -o pipefail
          scripts/dev/check.sh --setup | tee "${RUNNER_TEMP}/setup.log"
      # A pull request runs the checks jpdev.json maps its changed paths to, and the whole list
      # when a path is unmapped or the mapping, dev.json or the runner changed. A push to main runs
      # the whole list, and only that run is what a release is held to.
      - name: Checks
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          if [ "$EVENT" = pull_request ]; then
            scripts/dev/check.sh --all --changed "origin/$BASE_REF" | tee "${RUNNER_TEMP}/checks.log"
          else
            scripts/dev/check.sh --all | tee "${RUNNER_TEMP}/checks.log"
          fi
      # The job's evidence, on a push to main only: every setup step and check passed, read from
      # the two summaries, with the commit's inputs, the runner and the toolchains.
      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python3 scripts/dev/release_evidence.py capture --workflow ci --job check --setup-log "${RUNNER_TEMP}/setup.log" --check-log "${RUNNER_TEMP}/checks.log" --output "${RUNNER_TEMP}/evidence.json"
      - name: Upload immutable CI evidence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-ci-check-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7

  # The PostgreSQL storage kind (docs/adr/0031-a-second-storage-kind-on-postgresql.md): the store
  # conformance suite, the corpus exports, the byte identity with the filesystem kind, and the
  # conditions the kind runs under, against PostgreSQL 16, the major version docs/postgresql-store.md
  # names, in a service container pinned by digest. The credentials are synthetic and the server
  # lives as long as the job. The tests make roles and a database of their own per test and drop
  # them; without GATEWAY_TEST_POSTGRES_DSN they skip, and with GATEWAY_TEST_POSTGRES_REQUIRED set a
  # missing or malformed one fails them, and any skip left fails the job.
  postgresql:
    name: postgresql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # postgres:16-alpine, PostgreSQL 16.15
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: gateway_test_admin
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: gateway_test_admin
        ports:
          - 5432:5432
        options: '--health-cmd "pg_isready -U gateway_test_admin -d gateway_test_admin" --health-interval 2s --health-timeout 5s --health-retries 30'
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.5"
      - name: The PostgreSQL kind's tests, none skipped
        env:
          GATEWAY_TEST_POSTGRES_DSN: postgresql://gateway_test_admin:synthetic-ci-password@127.0.0.1:5432/gateway_test_admin?sslmode=disable
          GATEWAY_TEST_POSTGRES_REQUIRED: "1"
        run: |
          set -o pipefail
          go test -count=1 -timeout 20m -v -run '^(TestStoreKindsConform|TestPostgres.*|TestAPostgres.*|TestThePostgres.*|TestEveryCorpusStoreExportsFromThePostgresKindByteForByte|TestTheLoginHoldsTheServerToTheSCRAMExchange|TestAValueHoldingANULRoundTripsOnEveryKind)$' . | tee "${RUNNER_TEMP}/postgresql.log"
          if grep -q -- '--- SKIP' "${RUNNER_TEMP}/postgresql.log"; then
            grep -- '--- SKIP' "${RUNNER_TEMP}/postgresql.log"
            echo "a PostgreSQL test skipped"
            exit 1
          fi
      # The same tests as an administrator that may make roles and databases
      # and nothing more. Three cases need a superuser to set up and skip by
      # one message (docs/adr/0031, "Consequences"); any other skip fails.
      - name: The PostgreSQL kind's tests as an administrator that is no superuser
        env:
          GATEWAY_TEST_POSTGRES_DSN: postgresql://gateway_test_creator:synthetic-ci-creator-password@127.0.0.1:5432/gateway_test_admin?sslmode=disable
          GATEWAY_TEST_POSTGRES_REQUIRED: "1"
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -o pipefail
          docker exec "${POSTGRES_CONTAINER}" psql -v ON_ERROR_STOP=1 -U gateway_test_admin -d gateway_test_admin \
            -c "CREATE ROLE gateway_test_creator LOGIN CREATEROLE CREATEDB PASSWORD 'synthetic-ci-creator-password'"
          go test -count=1 -timeout 20m -v -run '^(TestStoreKindsConform|TestPostgres.*|TestAPostgres.*|TestThePostgres.*|TestEveryCorpusStoreExportsFromThePostgresKindByteForByte|TestTheLoginHoldsTheServerToTheSCRAMExchange|TestAValueHoldingANULRoundTripsOnEveryKind)$' . | tee "${RUNNER_TEMP}/postgresql-creator.log"
          skipped=$(grep -c -- '--- SKIP' "${RUNNER_TEMP}/postgresql-creator.log" || true)
          explained=$(grep -c -- 'the admin login is no superuser and cannot set this case up; the run as a superuser holds it' "${RUNNER_TEMP}/postgresql-creator.log" || true)
          if [ "${skipped}" != 3 ] || [ "${explained}" != 3 ]; then
            grep -B1 -- '--- SKIP' "${RUNNER_TEMP}/postgresql-creator.log" || true
            echo "the run as an administrator that is no superuser skipped ${skipped} tests, ${explained} of them for want of a superuser; want 3 and 3"
            exit 1
          fi
      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: .
        run: python3 scripts/dev/release_evidence.py capture --workflow ci --job postgresql --output "${RUNNER_TEMP}/evidence.json"
      - name: Upload immutable CI evidence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-ci-postgresql-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7
