name: CI

# The check list is dev.json, run by scripts/dev/check.sh (the development kit's vendored runner).
# Three jobs. `go` is the operating system matrix: its legs run the core's Go steps natively on each
# platform. The Linux and Windows legs' names are required by branch protection; the macOS leg runs
# on a push to main and on the nightly schedule, not on a pull request or a merge group, and is not
# required (a release takes main's run, macOS leg included). `check` is the one required name for
# dev.json's checks: two lanes, `check · go-tests` and `check · rest`, set the toolchains up from
# the manifest and run every step of it between them, each step in one lane: the core, the
# adapters, the release contents, the plugins, the second implementation, the engine image, the
# witness scenario and the agreement of the two paths; `check` fails unless both succeeded. On a
# pull request each lane runs its steps jpdev.json maps the changed paths to (`check.sh
# --changed`); on a push to main, all of its steps. Each of the steps that were jobs of
# their own is a step of dev.json, and the longer ones are scripts under scripts/checks/ with the
# comments they had here. `postgresql` runs the PostgreSQL storage kind's tests against a server in
# a service container pinned by digest (docs/postgresql-store.md), in two legs side by side, each
# with a server of its own: as a superuser, and as an administrator that is no superuser. Without
# a server the tests skip, so here a skip fails the leg (four, by one message, are expected in the
# second). The nightly run is the `go` matrix alone.
#
# A push to main also records, in every job and every leg, the evidence a release takes instead
# of running this workflow again (scripts/dev/release_evidence.py capture, configured by
# .github/ci-evidence.json; docs/releasing.md): the commit, its input identities, the runner and
# toolchain, for each check lane its setup steps' results, and for `check` every check's result. A pull request, a merge group and the nightly
# run record none.

on:
  pull_request:
  # The merge queue's group: the pull request on top of main and of the groups ahead of it, checked
  # before main moves (docs/releasing.md, "Merging").
  merge_group:
  push:
    branches: [main]
  # The macOS leg, which a pull request and a merge group run without, on main's tip each night.
  # Not evidence: the release gate takes a push to main, and refuses while a run of main at the
  # tagged commit, this one included, is unfinished or newer and failed (docs/releasing.md).
  schedule:
    - cron: "23 5 * * *"
  # Kept, but nothing calls it: the release takes the evidence a push to main
  # recorded at the tagged commit, or refuses (release.yml, docs/releasing.md).
  workflow_call:

# A new push to a pull request cancels that pull request's run in progress. A push to main, a
# merge group and a nightly run each have a group of their own event and commit, so no run of main,
# which a release takes as its evidence, is ever cancelled or dropped as a pending duplicate.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: ${{ matrix.os }} · Go ${{ matrix.go }}${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26"]
        # Windows, the slowest to run the core's tests, runs them in two shards side by side; Linux
        # and macOS in one leg each.
        shard: ["1", "2"]
        exclude:
          - os: ubuntu-latest
            shard: "2"
          - os: macos-latest
            shard: "2"
          # macOS runners are the slowest to start: a pull request and a merge group run without
          # that leg; a push to main and the nightly run have it. An exclude that matches nothing
          # removes nothing. No include names macOS: an include applied after this exclude would
          # make the leg again.
          - os: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'macos-latest' || 'none' }}
        # The Windows shards' name and evidence key; the other legs have neither.
        include:
          - os: windows-latest
            shard: "1"
            part: " · shard 1 of 2"
            key: "-1"
          - os: windows-latest
            shard: "2"
            part: " · shard 2 of 2"
            key: "-2"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # matrix.go is the line the job's name carries, and the names are what
      # branch protection requires. The toolchain is the one release.yml names,
      # exactly: the release takes each leg's evidence only at that version
      # (.github/ci-evidence.json; .github/test_ci_evidence.py holds the two equal).
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.5"
      - name: Formatting is canonical
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Tests
        if: matrix.os != 'windows-latest'
        run: go test ./...
      # Each top-level test of the core in exactly one shard, by the length of its name; the script
      # refuses unless Go's selection of this shard is that, and the two shards together are the
      # whole listing `go test -list` gives (.github/go_test_shard.py).
      - name: Tests, one shard of two
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: .
        env:
          SHARD: ${{ matrix.shard }}
        run: python .github/go_test_shard.py --dir go --shard "${SHARD}" --of 2
      - name: Native sandbox boundary tests
        if: matrix.os != 'windows-latest' || matrix.shard == '1'
        shell: bash
        working-directory: adapters
        env:
          GOWORK: off
        run: |
          go test -count=1 -timeout 90s ./internal/sandbox
          go test -count=1 -timeout 120s -run '^(TestWindowsCustomerSandboxUnavailable|TestCustomerExecutable.*|TestCustomerLoaderVariableRefused)$' ./mcp
      - name: Build
        run: go build -buildvcs=false -o gateway .
      # The corpus is the arbiter: frozen data, not output regenerated from
      # the code it checks. The second implementation answers to it in its
      # own job, below.
      - name: The implementation agrees with the frozen corpus
        run: ./gateway conform
      # The stand-in engine the plugin smoke checkers are tested against
      # (plugins/smoke/testing) is held to this engine, request for request:
      # a stand-in that drifts from the engine fails here, not in a smoke run
      # before publishing. Standard library Python; the source it starts the
      # engine with is a shell script, so Linux only.
      - name: The smoke stand-in answers as this engine does
        if: matrix.os == 'ubuntu-latest'
        env:
          GATEWAY_BIN: ${{ github.workspace }}/go/gateway
          SMOKE_REQUIRE_ENGINE: "1"
        run: python3 -m unittest discover -s ../plugins/smoke/testing -p test_stand_in_engine.py -v
      - name: No third-party modules
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -f go.sum ]; then echo "go.sum exists: a dependency crept in"; exit 1; fi
          go list -deps . | grep -v '^gateway$' | grep -vE '^(internal/|[a-z]+(/|$))' && exit 1 || true
      # The process boundary is the security claim (docs/adr/0001): the module
      # that holds the seed is never linked to the module that holds platform
      # credentials. The filter above judges import spelling, and spelling is
      # not provenance: a workspace file or a replace directive can make any
      # name resolve anywhere. So this step asks the toolchain where every
      # dependency actually resolved (`.Standard`), with workspaces disabled,
      # and refuses the files and directives that would redirect resolution.
      - name: Every core dependency resolves into the standard library
        if: matrix.os == 'ubuntu-latest'
        env:
          GOWORK: off
        run: |
          find .. -name go.work -not -path '*/.git/*' | grep -q . && { echo "a go.work file is present"; exit 1; } || true
          grep -nE '^\s*(require|replace|exclude)\b' go.mod && { echo "go.mod declares a dependency, replacement, or exclusion"; exit 1; } || true
          go list -deps -f '{{.ImportPath}} {{.Standard}} {{.Dir}}' . \
            | awk '$1 != "gateway" && $2 != "true" { print "resolves outside the standard library: " $0; bad = 1 } END { exit bad }'
          go list -deps . | grep -qx plugin && { echo "the core imports plugin"; exit 1; } || true
      # The leg's evidence, on a push to main only: its platform and toolchain,
      # beside the job's result the API reports. From the checkout's root, with
      # the interpreter each image carries.
      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        working-directory: .
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          JOB_KEY: go-${{ matrix.os }}${{ matrix.key }}
        run: |
          "${PYTHON}" scripts/dev/release_evidence.py capture --workflow ci --job "${JOB_KEY}" --output "${RUNNER_TEMP}/evidence.json"
      - name: Upload immutable CI evidence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-ci-go-${{ matrix.os }}${{ matrix.key }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7

  # dev.json's checks in two lanes side by side (.github/check_lanes.py): `go-tests` holds the checks
  # that build and run the core's and the adapters' Go tests, which share one build of each module's
  # test binaries; `rest` holds every other check, a check added to dev.json later included. Each
  # lane skips the other's checks, so every check runs in exactly one lane. Each lane sets the
  # toolchains up and runs every setup step, and records its evidence (the toolchains and the setup
  # steps) on a push to main; `check` records the checks' results.
  check-lanes:
    name: check · ${{ matrix.lane }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: go-tests
          - lane: rest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The whole history, so that --changed finds the merge base with the base branch.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # First, so that a manifest that does not parse fails before the long steps start.
      - name: Read the toolchains from dev.json and release.yml
        id: dev
        run: |
          set -eu
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("dev.json", encoding="utf-8"))
          tc = m.get("toolchains", {})
          print("node=" + tc.get("node", {}).get("version", ""))
          print("python=" + tc.get("python", {}).get("version", "3.12"))
          PY
          # The toolchain the release workflow names, exactly: the third-party notices carry the
          # toolchain's own licence, so they are held with the toolchain that links a release
          # (scripts/checks/release-toolchain.sh checks that this is it).
          named="$(sed -n "s/^ *go-version: *['\"]\{0,1\}\([0-9][0-9.]*\)['\"]\{0,1\} *\$/\1/p" .github/workflows/release.yml)"
          [ -n "${named}" ] || { echo 'release.yml names no Go version' >&2; exit 1; }
          echo "go=${named}" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ steps.dev.outputs.go }}
          cache-dependency-path: adapters/go.sum
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.dev.outputs.node }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.dev.outputs.python }}
      # Each summary is kept for the evidence below.
      - name: Setup steps
        run: |
          set -o pipefail
          scripts/dev/check.sh --setup | tee "${RUNNER_TEMP}/setup.log"
      # The other lane's checks, from dev.json as the commit holds it; a name the lane list holds
      # and dev.json does not fails here.
      - name: The lane's checks
        id: lane
        env:
          LANE: ${{ matrix.lane }}
        run: python3 .github/check_lanes.py --lane "${LANE}" >> "$GITHUB_OUTPUT"
      # A pull request runs the checks of the lane jpdev.json maps its changed paths to, and the
      # whole lane when a path is unmapped or the mapping, dev.json or the runner changed. A push to
      # main runs the whole lane, and only that run is what a release is held to.
      - name: Checks
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          SKIP: ${{ steps.lane.outputs.skip }}
        run: |
          set -o pipefail
          if [ "$EVENT" = pull_request ]; then
            scripts/dev/check.sh --all --skip "$SKIP" --changed "origin/$BASE_REF" | tee "${RUNNER_TEMP}/checks.log"
          elif [ "$EVENT" = merge_group ]; then
            scripts/dev/check.sh --all --skip "$SKIP" --changed "$GROUP_BASE" | tee "${RUNNER_TEMP}/checks.log"
          else
            scripts/dev/check.sh --all --skip "$SKIP" | tee "${RUNNER_TEMP}/checks.log"
          fi
      # The lane's evidence, on a push to main only: every setup step passed, read from its
      # summary, with the commit's inputs, the runner and the toolchains.
      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          JOB_KEY: check-${{ matrix.lane }}
        run: python3 scripts/dev/release_evidence.py capture --workflow ci --job "${JOB_KEY}" --setup-log "${RUNNER_TEMP}/setup.log" --output "${RUNNER_TEMP}/evidence.json"
      - name: Upload immutable CI evidence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-ci-check-${{ matrix.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7
      # The lane's check summary, which the check job's evidence reads.
      - name: Keep the check summary for the check job
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-check-summary-${{ matrix.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checks.log
          if-no-files-found: error
          retention-days: 1

  # The one required name for dev.json's checks: it fails unless both lanes succeeded. It runs when
  # a lane failed or the run was cancelled too (always()), so that it fails rather than being
  # skipped, which a required check would count as passed. On a push to main it records the evidence of the whole list: every check's
  # result, read from the two lanes' summaries of this attempt (each check in exactly one), with the
  # commit's inputs and the toolchains, set up here as the lanes set them up.
  check:
    name: check
    needs: check-lanes
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Both lanes passed
        env:
          LANES: ${{ needs.check-lanes.result }}
        run: |
          if [ "${LANES}" != success ]; then
            echo "the check lanes ended ${LANES}, not success"
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the toolchains from dev.json and release.yml
        id: dev
        run: |
          set -eu
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("dev.json", encoding="utf-8"))
          tc = m.get("toolchains", {})
          print("node=" + tc.get("node", {}).get("version", ""))
          print("python=" + tc.get("python", {}).get("version", "3.12"))
          PY
          # The toolchain the release workflow names, exactly: the third-party notices carry the
          # toolchain's own licence, so they are held with the toolchain that links a release
          # (scripts/checks/release-toolchain.sh checks that this is it).
          named="$(sed -n "s/^ *go-version: *['\"]\{0,1\}\([0-9][0-9.]*\)['\"]\{0,1\} *\$/\1/p" .github/workflows/release.yml)"
          [ -n "${named}" ] || { echo 'release.yml names no Go version' >&2; exit 1; }
          echo "go=${named}" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ steps.dev.outputs.go }}
          # Resolving the toolchain is all this job asks of it: no module cache.
          cache: false
      - name: Set up Node
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.dev.outputs.node }}
      - name: Set up Python
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.dev.outputs.python }}
      - name: The go-tests lane's check summary
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-check-summary-go-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-tests
      - name: The rest lane's check summary
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-check-summary-rest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rest
      # The job's evidence, on a push to main only: every check passed, read from the lanes' two
      # summaries, with the commit's inputs, the runner and the toolchains.
      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python3 scripts/dev/release_evidence.py capture --workflow ci --job check --check-log "${RUNNER_TEMP}/go-tests/checks.log" --check-log "${RUNNER_TEMP}/rest/checks.log" --output "${RUNNER_TEMP}/evidence.json"
      - name: Upload immutable CI evidence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-ci-check-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7

  # The PostgreSQL storage kind (docs/adr/0031-a-second-storage-kind-on-postgresql.md): the store
  # conformance suite, the corpus exports, the byte identity with the filesystem kind, and the
  # conditions the kind runs under, against PostgreSQL 16, the major version docs/postgresql-store.md
  # names, in a service container pinned by digest. The credentials are synthetic and the server
  # lives as long as the leg. The tests make roles and a database of their own per test and drop
  # them; without GATEWAY_TEST_POSTGRES_DSN they skip, and with GATEWAY_TEST_POSTGRES_REQUIRED set a
  # missing or malformed one fails them, and any skip left fails the leg. The same tests run in both
  # legs, each leg against its own server: the superuser leg also runs the storage kinds through the
  # binary.
  postgresql:
    name: postgresql · ${{ matrix.role }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: superuser
          - role: non-superuser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # postgres:16-alpine, PostgreSQL 16.15
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: gateway_test_admin
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: gateway_test_admin
        ports:
          - 5432:5432
        options: '--health-cmd "pg_isready -U gateway_test_admin -d gateway_test_admin" --health-interval 2s --health-timeout 5s --health-retries 30'
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.5"
      - name: The PostgreSQL kind's tests, none skipped
        if: matrix.role == 'superuser'
        env:
          GATEWAY_TEST_POSTGRES_DSN: postgresql://gateway_test_admin:synthetic-ci-password@127.0.0.1:5432/gateway_test_admin?sslmode=disable
          GATEWAY_TEST_POSTGRES_REQUIRED: "1"
        run: |
          set -o pipefail
          go test -count=1 -timeout 20m -v -run '^(TestStoreKindsConform|TestPostgres.*|TestAPostgres.*|TestThePostgres.*|TestEveryCorpusStoreExportsFromThePostgresKindByteForByte|TestTheLoginHoldsTheServerToTheSCRAMExchange|TestAValueHoldingANULRoundTripsOnEveryKind)$' . | tee "${RUNNER_TEMP}/postgresql.log"
          if grep -q -- '--- SKIP' "${RUNNER_TEMP}/postgresql.log"; then
            grep -- '--- SKIP' "${RUNNER_TEMP}/postgresql.log"
            echo "a PostgreSQL test skipped"
            exit 1
          fi
      # The same tests as an administrator that may make roles and databases
      # and nothing more. Three cases need a superuser to set up and skip by
      # one message (docs/adr/0031, "Consequences"); any other skip fails.
      - name: The PostgreSQL kind's tests as an administrator that is no superuser
        if: matrix.role == 'non-superuser'
        env:
          GATEWAY_TEST_POSTGRES_DSN: postgresql://gateway_test_creator:synthetic-ci-creator-password@127.0.0.1:5432/gateway_test_admin?sslmode=disable
          GATEWAY_TEST_POSTGRES_REQUIRED: "1"
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -o pipefail
          docker exec "${POSTGRES_CONTAINER}" psql -v ON_ERROR_STOP=1 -U gateway_test_admin -d gateway_test_admin \
            -c "CREATE ROLE gateway_test_creator LOGIN CREATEROLE CREATEDB PASSWORD 'synthetic-ci-creator-password'"
          go test -count=1 -timeout 20m -v -run '^(TestStoreKindsConform|TestPostgres.*|TestAPostgres.*|TestThePostgres.*|TestEveryCorpusStoreExportsFromThePostgresKindByteForByte|TestTheLoginHoldsTheServerToTheSCRAMExchange|TestAValueHoldingANULRoundTripsOnEveryKind)$' . | tee "${RUNNER_TEMP}/postgresql-creator.log"
          skipped=$(grep -c -- '--- SKIP' "${RUNNER_TEMP}/postgresql-creator.log" || true)
          explained=$(grep -c -- 'the admin login is no superuser and cannot set this case up; the run as a superuser holds it' "${RUNNER_TEMP}/postgresql-creator.log" || true)
          if [ "${skipped}" != 4 ] || [ "${explained}" != 4 ]; then
            grep -B1 -- '--- SKIP' "${RUNNER_TEMP}/postgresql-creator.log" || true
            echo "the run as an administrator that is no superuser skipped ${skipped} tests, ${explained} of them for want of a superuser; want 4 and 4"
            exit 1
          fi
      - name: The storage kinds through the binary
        if: matrix.role == 'superuser'
        env:
          GATEWAY_TEST_POSTGRES_DSN: postgresql://gateway_test_admin:synthetic-ci-password@127.0.0.1:5432/gateway_test_admin?sslmode=disable
        run: ../scripts/checks/storage-scenario.sh
      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: .
        env:
          JOB_KEY: postgresql-${{ matrix.role }}
        run: python3 scripts/dev/release_evidence.py capture --workflow ci --job "${JOB_KEY}" --output "${RUNNER_TEMP}/evidence.json"
      - name: Upload immutable CI evidence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-ci-postgresql-${{ matrix.role }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7
