name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: ${{ matrix.os }} · Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.26"
          - os: macos-latest
            go: "1.26"
          - os: windows-latest
            go: "1.26"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go }}
      - name: Formatting is canonical
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Build
        run: go build -buildvcs=false -o gateway .
      # The corpus is the arbiter. With one implementation it is what stops the
      # format drifting: it is frozen data, not output regenerated from the code
      # it checks.
      - name: The implementation agrees with the frozen corpus
        run: ./gateway conform
      - name: No third-party modules
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -f go.sum ]; then echo "go.sum exists: a dependency crept in"; exit 1; fi
          go list -deps . | grep -v '^gateway$' | grep -vE '^(internal/|[a-z]+(/|$))' && exit 1 || true
      # The process boundary is the security claim (docs/adr/0001): the module
      # that holds the seed is never linked to the module that holds platform
      # credentials. The filter above judges import spelling, and spelling is
      # not provenance: a workspace file or a replace directive can make any
      # name resolve anywhere. So this step asks the toolchain where every
      # dependency actually resolved (`.Standard`), with workspaces disabled,
      # and refuses the files and directives that would redirect resolution.
      - name: Every core dependency resolves into the standard library
        if: matrix.os == 'ubuntu-latest'
        env:
          GOWORK: off
        run: |
          find .. -name go.work -not -path '*/.git/*' | grep -q . && { echo "a go.work file is present"; exit 1; } || true
          grep -nE '^\s*(require|replace|exclude)\b' go.mod && { echo "go.mod declares a dependency, replacement, or exclusion"; exit 1; } || true
          go list -deps -f '{{.ImportPath}} {{.Standard}} {{.Dir}}' . \
            | awk '$1 != "gateway" && $2 != "true" { print "resolves outside the standard library: " $0; bad = 1 } END { exit bad }'
          go list -deps . | grep -qx plugin && { echo "the core imports plugin"; exit 1; } || true

  adapters:
    name: adapters · Go 1.26
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters
    env:
      GOWORK: off
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26"
      - name: Formatting is canonical
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Build
        run: go build -buildvcs=false ./...
      # The mirror of the core's rule: an adapter may take dependencies the core
      # never will, but no dependency may resolve into the core's directory,
      # under any import name, and nothing may redirect resolution.
      - name: No adapters dependency resolves into the core
        run: |
          find .. -name go.work -not -path '*/.git/*' | grep -q . && { echo "a go.work file is present"; exit 1; } || true
          grep -nE '^\s*replace\b' go.mod && { echo "go.mod carries a replace directive"; exit 1; } || true
          core="$(cd ../go && pwd)"
          go list -deps -f '{{.ImportPath}} {{.Dir}}' ./... \
            | awk -v core="$core" '$2 == core || index($2, core "/") == 1 { print "resolves into the core: " $0; bad = 1 } END { exit bad }'
          go list -deps ./... | grep -qx plugin && { echo "an adapter imports plugin"; exit 1; } || true
