name: CI

# The check list is dev.json, run by scripts/dev/check.sh (the development kit's vendored runner).
# Two jobs. `go` is the operating system matrix: its job names are required by branch protection,
# and its legs run the core's Go steps natively on each platform. `check` sets the toolchains up
# from the manifest and runs every step of it: the core, the adapters, the release contents, the
# plugins, the second implementation, the engine image, the witness scenario and the agreement of
# the two paths. Each of the steps that were jobs of their own is a step of dev.json, and the
# longer ones are scripts under scripts/checks/ with the comments they had here.

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow calls this one at a tag, so a release is held to
  # what a commit is held to, as it stands at that tag (release.yml).
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: ${{ matrix.os }} · Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.26"
          - os: macos-latest
            go: "1.26"
          - os: windows-latest
            go: "1.26"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go }}
      - name: Formatting is canonical
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Build
        run: go build -buildvcs=false -o gateway .
      # The corpus is the arbiter: frozen data, not output regenerated from
      # the code it checks. The second implementation answers to it in its
      # own job, below.
      - name: The implementation agrees with the frozen corpus
        run: ./gateway conform
      # The stand-in engine the plugin smoke checkers are tested against
      # (plugins/smoke/testing) is held to this engine, request for request:
      # a stand-in that drifts from the engine fails here, not in a smoke run
      # before publishing. Standard library Python; the source it starts the
      # engine with is a shell script, so Linux only.
      - name: The smoke stand-in answers as this engine does
        if: matrix.os == 'ubuntu-latest'
        env:
          GATEWAY_BIN: ${{ github.workspace }}/go/gateway
          SMOKE_REQUIRE_ENGINE: "1"
        run: python3 -m unittest discover -s ../plugins/smoke/testing -p test_stand_in_engine.py -v
      - name: No third-party modules
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -f go.sum ]; then echo "go.sum exists: a dependency crept in"; exit 1; fi
          go list -deps . | grep -v '^gateway$' | grep -vE '^(internal/|[a-z]+(/|$))' && exit 1 || true
      # The process boundary is the security claim (docs/adr/0001): the module
      # that holds the seed is never linked to the module that holds platform
      # credentials. The filter above judges import spelling, and spelling is
      # not provenance: a workspace file or a replace directive can make any
      # name resolve anywhere. So this step asks the toolchain where every
      # dependency actually resolved (`.Standard`), with workspaces disabled,
      # and refuses the files and directives that would redirect resolution.
      - name: Every core dependency resolves into the standard library
        if: matrix.os == 'ubuntu-latest'
        env:
          GOWORK: off
        run: |
          find .. -name go.work -not -path '*/.git/*' | grep -q . && { echo "a go.work file is present"; exit 1; } || true
          grep -nE '^\s*(require|replace|exclude)\b' go.mod && { echo "go.mod declares a dependency, replacement, or exclusion"; exit 1; } || true
          go list -deps -f '{{.ImportPath}} {{.Standard}} {{.Dir}}' . \
            | awk '$1 != "gateway" && $2 != "true" { print "resolves outside the standard library: " $0; bad = 1 } END { exit bad }'
          go list -deps . | grep -qx plugin && { echo "the core imports plugin"; exit 1; } || true

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # First, so that a manifest that does not parse fails before the long steps start.
      - name: Read the toolchains from dev.json and release.yml
        id: dev
        run: |
          set -eu
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("dev.json", encoding="utf-8"))
          tc = m.get("toolchains", {})
          print("node=" + tc.get("node", {}).get("version", ""))
          print("python=" + tc.get("python", {}).get("version", "3.12"))
          PY
          # The toolchain the release workflow names, exactly: the third-party notices carry the
          # toolchain's own licence, so they are held with the toolchain that links a release
          # (scripts/checks/release-toolchain.sh checks that this is it).
          named="$(sed -n "s/^ *go-version: *['\"]\{0,1\}\([0-9][0-9.]*\)['\"]\{0,1\} *\$/\1/p" .github/workflows/release.yml)"
          [ -n "${named}" ] || { echo 'release.yml names no Go version' >&2; exit 1; }
          echo "go=${named}" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ steps.dev.outputs.go }}
          cache-dependency-path: adapters/go.sum
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.dev.outputs.node }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.dev.outputs.python }}
      - name: Setup steps
        run: scripts/dev/check.sh --setup
      - name: Checks
        run: scripts/dev/check.sh --all
