name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: ${{ matrix.os }} · Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.26"
          - os: macos-latest
            go: "1.26"
          - os: windows-latest
            go: "1.26"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go }}
      - name: Formatting is canonical
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Build
        run: go build -buildvcs=false -o gateway .
      # The corpus is the arbiter. With one implementation it is what stops the
      # format drifting: it is frozen data, not output regenerated from the code
      # it checks.
      - name: The implementation agrees with the frozen corpus
        run: ./gateway conform
      - name: No third-party modules
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -f go.sum ]; then echo "go.sum exists: a dependency crept in"; exit 1; fi
          go list -deps . | grep -v '^gateway$' | grep -vE '^(internal/|[a-z]+(/|$))' && exit 1 || true
